<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проект Хель</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">Х</div>
        <div>
          <div class="brand-title">Проект Хель</div>
          <div class="brand-subtitle">локальный ассистент</div>
        </div>
      </div>
      <div class="modes-title">Режимы</div>
      <div id="modeList" class="mode-list"></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h1 id="modeTitle">Общий</h1>
          <p id="modeDescription">Универсальный режим ассистента</p>
        </div>
        <div class="status-block">
          <span class="status-dot"></span>
          <span>API: <strong id="apiStatus">подключение...</strong></span>
        </div>
      </header>

      <section id="chat" class="chat-area"></section>

      <section class="composer">
        <textarea id="input" placeholder="Введите сообщение..."></textarea>
        <div class="composer-actions">
          <button id="send">Отправить</button>
        </div>
      </section>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden"></div>

  <div id="planModal" class="modal hidden">
    <h3>Подтверждение плана</h3>
    <pre id="planMessage"></pre>
    <div class="modal-actions">
      <button id="planApprove">Выполнить</button>
      <button id="planReject" class="secondary">Отклонить</button>
    </div>
  </div>

  <div id="permissionModal" class="modal hidden">
    <h3>Запрос разрешения</h3>
    <div id="permissionMessage"></div>
    <div class="modal-actions">
      <button id="permissionAllow">Разрешить</button>
      <button id="permissionDeny" class="secondary">Отказать</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
